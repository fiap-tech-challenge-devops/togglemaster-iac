name: IaC — Plan

# A esteira em si vive em fiap-tech-challenge-devops/reusable-workflows. Aqui
# ficam só o gatilho, a concorrência e os parâmetros deste projeto.
#
# Em PR, os jobs do workflow chamado são os checks obrigatórios do ruleset da
# main: sem todos verdes, o botão de merge fica bloqueado.
#
# ATENÇÃO ao nome dos checks: um workflow chamado reporta como
# "<job do caller> / <job do chamado>". Por isso o job abaixo se chama "iac" —
# os checks viram "iac / Plan (infra)" e afins, e o ruleset precisa listar
# exatamente esses nomes. Trocar o nome do job aqui quebra o merge.

on:
  pull_request:
    branches: [main]
  # Mantido para diagnóstico fora de PR.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  # head_ref só existe em pull_request; em disparo manual cai para o ref da branch.
  group: iac-plan-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: iac
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-plan.yml@v2.2.2
    with:
      # bootstrap fica de fora: é aplicado por disparo manual e raro, e não entra
      # no fluxo de PR -> merge -> apply que este workflow protege.
      #
      # addons não é obrigatório: ele lê do SSM parâmetros que só existem depois
      # do apply do infra, e num ambiente ainda não provisionado o plan dele
      # falha — isso não deve bloquear o PR.
      stages: >-
        [{"stage":"infra","required":true},{"stage":"addons","required":false}]
      summary-stage: infra
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
      openai-model: gpt-5.6-terra
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
      openai-api-key: ${{ secrets.OPENAI_API_KEY }}
