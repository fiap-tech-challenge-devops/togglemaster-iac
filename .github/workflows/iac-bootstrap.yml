name: IaC — Bootstrap (backend S3)

# Resolve o ovo-e-galinha do state remoto: o bucket que guarda o tfstate não pode
# guardar o state que o cria. Este stage roda com state LOCAL e o resultado é
# descartável — a partir daqui, infra e addons usam o backend remoto.
#
# Executado uma única vez na vida do projeto. O job é idempotente: se o bucket já
# existe, ele não faz nada.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "BOOTSTRAP" para confirmar'
        type: string
        required: true
      region:
        description: "Região AWS"
        type: string
        default: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region }}
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"

jobs:
  bootstrap:
    name: Criar backend remoto
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ inputs.confirm }}" != "BOOTSTRAP" ]; then
            echo "Abortado: confirm deve ser exatamente BOOTSTRAP."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verificar se o backend já existe
        id: check
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="togglemaster-iac-tfstate-${ACCOUNT_ID}"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Bucket ${BUCKET} já existe — nada a fazer."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Bucket ${BUCKET} não existe — será criado."
          fi

      - name: Terraform init (state local)
        if: steps.check.outputs.exists == 'false'
        working-directory: bootstrap
        run: terraform init -input=false

      - name: Terraform apply
        if: steps.check.outputs.exists == 'false'
        working-directory: bootstrap
        run: terraform apply -input=false -auto-approve

      - name: Resumo
        run: |
          {
            echo "### Backend remoto"
            echo ""
            echo "- Bucket: \`${{ steps.check.outputs.bucket }}\`"
            echo "- Região: \`${{ env.AWS_REGION }}\`"
            echo "- Lock: arquivo no próprio S3 (\`use_lockfile\`), sem tabela DynamoDB"
            echo ""
            if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
              echo "Já existia — nenhuma alteração."
            else
              echo "Criado agora. O state local deste stage é descartável."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
