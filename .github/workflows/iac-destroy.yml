name: IaC — Destroy (apps → addons → infra)

# A esteira vive em fiap-tech-challenge-devops/reusable-workflows.
# Doc: docs/terraform-destroy/ naquele repositório.
#
# Aqui o environment fica: o destroy roda por disparo manual, sem PR e sem plano
# para ler antes. É a única confirmação humana no caminho.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "DESTROY" para confirmar'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Confirmar
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Abortado: confirm deve ser exatamente DESTROY."
            exit 1
          fi

  # eks-cleanup só no primeiro da cadeia: ALBs e nós do Karpenter não estão no
  # tfstate e, se sobreviverem, seguram a VPC.
  addons:
    needs: guard
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-destroy.yml@v2.2.2
    with:
      stage: addons
      state-bucket-prefix: togglemaster-iac-tfstate
      environment: production
      eks-cleanup: true
      eks-cluster-ssm-parameter: /togglemaster/iac/cluster-name
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}

  infra:
    needs: addons
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-destroy.yml@v2.2.2
    with:
      stage: infra
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
