name: IaC — Destroy (apps → addons → infra)

# A esteira vive em fiap-tech-challenge-devops/reusable-workflows.
# Doc: docs/terraform-destroy/ naquele repositório.
#
# Dois gatilhos, com confirmações diferentes:
#
#   workflow_dispatch — exige digitar DESTROY. Sem PR e sem plano para ler
#   antes, é a única confirmação humana no caminho.
#
#   schedule — rede de segurança para o dia em que ninguém lembrar de derrubar
#   o ambiente. Não há humano para confirmar, então a confirmação é dispensada
#   de propósito: o custo de destruir um ambiente de laboratório à noite é
#   menor que o de deixar um EKS ligado o fim de semana inteiro.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "DESTROY" para confirmar'
        type: string
        required: true

  # 04:00 UTC = 01:00 em Brasília. O cron do GitHub é sempre UTC e não conhece
  # fuso; o Brasil não tem horário de verão desde 2019, então UTC-3 o ano todo.
  schedule:
    - cron: "0 4 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Confirmar
    runs-on: ubuntu-latest
    steps:
      # CONFIRM vai por env, não interpolado no script: entrada de texto livre
      # colada dentro de um shell é injeção esperando acontecer.
      - env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Disparo agendado — confirmação dispensada."
            exit 0
          fi

          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "Abortado: confirm deve ser exatamente DESTROY."
            exit 1
          fi

  # eks-cleanup só no primeiro da cadeia: ALBs e nós do Karpenter não estão no
  # tfstate e, se sobreviverem, seguram a VPC.
  addons:
    needs: guard
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-destroy.yml@v2.4.0
    with:
      stage: addons
      state-bucket-prefix: togglemaster-iac-tfstate
      environment: production
      eks-cleanup: true
      eks-cluster-ssm-parameter: /togglemaster/iac/cluster-name
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}

  infra:
    needs: addons
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-destroy.yml@v2.4.0
    with:
      stage: infra
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
      # O destroy também carrega as variáveis: sem isto, datadog_api_key
      # reprova e o infra fica de pé depois de o addons já ter caído.
      tf-vars: ${{ secrets.TF_VARS_INFRA }}
