name: IaC — Apply (infra → addons)

# A esteira vive em fiap-tech-challenge-devops/reusable-workflows.
# Doc: docs/terraform-apply/ naquele repositório.
#
# Sem gate de aprovação, deliberadamente: o gate é o pull request. O ruleset da
# main exige o plan verde, e quem aprova o PR já decidiu aplicar, com o plano na
# frente para ler. Um apply parado num environment ainda segurava o grupo de
# concurrency e enfileirava os merges seguintes.

on:
  # Atenção ao filtro de paths: um PR que só toque bootstrap/, docs ou o
  # .checkov.yaml passa no plan, mergeia e NÃO dispara apply.
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "addons/**"
      - ".github/workflows/iac-apply.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# cancel-in-progress false: cancelar um apply pela metade deixa o state
# divergente da realidade.
concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infra:
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-apply.yml@v2.4.0
    with:
      stage: infra
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
      tf-vars: ${{ secrets.TF_VARS_INFRA }}

  # needs: é o que garante a ordem. O addons lê do SSM parâmetros que o infra cria.
  addons:
    needs: infra
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-apply.yml@v2.4.0
    with:
      stage: addons
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
      summary-extra: |
        #### Acessar o Argo CD

        O `argocd-server` é `ClusterIP`: o acesso é por túnel.

        ```bash
        aws eks update-kubeconfig --name eks-togglemaster --region us-east-1
        kubectl port-forward svc/argocd-server -n argocd 8080:443
        ```

        Abra <https://localhost:8080> e aceite o certificado autoassinado.
        Usuário `admin`; a senha está no cofre do time.

        Se a senha não tiver sido definida, o Argo CD gera uma na instalação:

        ```bash
        kubectl get secret argocd-initial-admin-secret -n argocd \
          -o jsonpath='{.data.password}' | base64 -d
        ```
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
      tf-vars: ${{ secrets.TF_VARS_ADDONS }}

  # Sem needs: não depende de AWS. Vem antes do datadog porque é aqui que a
  # integração nasce — o handle @pagerduty-<serviço> na mensagem do monitor só
  # roteia depois que o serviço existe. Ver ADR 0033.
  pagerduty:
    concurrency:
      group: pagerduty-${{ github.ref }}
      cancel-in-progress: false
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-apply.yml@v2.4.0
    with:
      stage: pagerduty
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
      tf-vars: ${{ secrets.TF_VARS_INFRA }}

  # needs: pagerduty dá a ordem; o if tira o bloqueio. A mensagem do monitor
  # cita @pagerduty-<serviço>, então vir depois é melhor — mas uma falha num
  # stage de SaaS que não custa nada não pode impedir os monitores de subirem.
  # Sem handle que roteie, o alerta no Slack e o self-healing seguem de pé.
  #
  # Mesmo padrão do iac-destroy, e pela mesma razão.
  datadog:
    needs: pagerduty
    if: ${{ !cancelled() }}
    # Mesmo grupo do datadog-apply.yml: grupo de concorrência é escopado pelo
    # repositório, então os dois escritores do datadog.tfstate serializam. Um
    # commit que toque datadog/ e este arquivo dispara os dois ao mesmo tempo,
    # e sem isto um falha em "Error acquiring the state lock".
    concurrency:
      group: datadog-${{ github.ref }}
      cancel-in-progress: false
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-apply.yml@v2.4.0
    with:
      stage: datadog
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
      tf-vars: ${{ secrets.TF_VARS_INFRA }}
