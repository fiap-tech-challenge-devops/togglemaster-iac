name: IaC — Apply (infra → addons)

# A esteira vive em fiap-tech-challenge-devops/reusable-workflows.
# Doc: docs/terraform-apply/ naquele repositório.
#
# Sem gate de aprovação, deliberadamente: o gate é o pull request. O ruleset da
# main exige o plan verde, e quem aprova o PR já decidiu aplicar, com o plano na
# frente para ler. Um apply parado num environment ainda segurava o grupo de
# concurrency e enfileirava os merges seguintes.

on:
  # Atenção ao filtro de paths: um PR que só toque bootstrap/, docs ou o
  # .checkov.yaml passa no plan, mergeia e NÃO dispara apply.
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "addons/**"
      - ".github/workflows/iac-apply.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# cancel-in-progress false: cancelar um apply pela metade deixa o state
# divergente da realidade.
concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infra:
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-apply.yml@v1.1.1
    with:
      stage: infra
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}

  # needs: é o que garante a ordem. O addons lê do SSM parâmetros que o infra cria.
  addons:
    needs: infra
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/terraform-apply.yml@v1.1.1
    with:
      stage: addons
      state-bucket-prefix: togglemaster-iac-tfstate
      aws-region: us-east-1
      terraform-version: "1.15.8"
    secrets:
      aws-oidc-role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN_VITAO }}
