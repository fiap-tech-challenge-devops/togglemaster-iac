apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      auth:
        # Sem credencial estática: o operator assume a role IRSA anotada no seu
        # ServiceAccount. É por isso que o jwt/serviceAccountRef aponta para ele.
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccountName }}
            namespace: {{ .Values.namespace }}
